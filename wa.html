<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שליחה בוואטסאפ</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#F4F7FB;color:#1B2436;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
  .card{background:#fff;border:1px solid #E2E8F3;border-radius:14px;padding:28px 24px;max-width:360px;width:100%;text-align:center;box-shadow:0 2px 10px rgba(19,35,64,.06);}
  h1{font-size:18px;margin:0 0 12px;color:#132340;}
  p{font-size:14px;color:#6B7690;margin:0 0 18px;white-space:pre-wrap;text-align:right;}
  a.btn{display:block;background:#25D366;color:#fff;text-decoration:none;padding:13px;border-radius:999px;font-weight:700;font-size:15px;}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">פותח וואטסאפ...</h1>
  <p id="msg"></p>
  <a id="go" class="btn" style="display:none">שליחה בוואטסאפ</a>
</div>
<script>
(async function(){
  const FIREBASE_BASE = 'https://clinic-9e83b-default-rtdb.firebaseio.com';
  const id = new URLSearchParams(location.search).get('id');
  const title = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const go = document.getElementById('go');
  if(!id){ title.textContent = 'קישור לא תקין'; return; }
  try{
    const resp = await fetch(FIREBASE_BASE + '/waMessages/' + encodeURIComponent(id) + '.json');
    const message = await resp.json();
    if(!message || typeof message !== 'string'){ title.textContent = 'ההודעה לא נמצאה'; return; }
    const link = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(message);
    msgEl.textContent = message;
    go.href = link;
    go.style.display = 'block';
    title.textContent = 'ההודעה מוכנה לשליחה';
    location.replace(link);
  }catch(e){
    title.textContent = 'שגיאה בטעינת ההודעה';
    msgEl.textContent = String(e);
  }
})();
</script>
</body>
</html>
